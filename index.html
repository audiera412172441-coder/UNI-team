    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap');

        body {
            font-family: 'Noto Sans TC', 'Inter', sans-serif;
            background-color: #f8fafc;
            background-image: radial-gradient(at 0% 0%, hsla(210, 100%, 97%, 1) 0px, transparent 50%),
                              radial-gradient(at 100% 0%, hsla(210, 50%, 95%, 1) 0px, transparent 50%);
            background-attachment: fixed;
            overflow-x: hidden;
        }

        /* CSS Variables for Dynamic Theming */
        :root {
            --theme-color: #f59e0b; /* Default Amber */
            --theme-color-light: #fef3c7;
            --theme-color-dark: #d97706;
        }

        .theme-bg { background-color: var(--theme-color) !important; }
        .theme-bg-light { background-color: var(--theme-color-light) !important; }
        .theme-border { border-color: var(--theme-color) !important; }
        .theme-text { color: var(--theme-color) !important; }
        .theme-ring { ring-color: var(--theme-color) !important; }

        /* =========================================
           翻牌卡核心 CSS 架構 (嚴格依據使用者指定)
           ========================================= */
        .flip-card {
            perspective: 1200px;
            height: 250px;
            cursor: pointer;
        }
        .flip-card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform .55s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
        }
        .flip-card.flipped .flip-card-inner {
            transform: rotateY(180deg);
        }
        .flip-face {
            position: absolute;
            inset: 0;
            backface-visibility: hidden;
            border-radius: 1rem;
            overflow-y: auto;
            background-color: #ffffff;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            border: 2px solid #e2e8f0;
            display: flex;
            flex-direction: column;
        }
        .flip-back {
            transform: rotateY(180deg);
            border-color: var(--theme-color);
        }

        /* 翻牌卡內層的自訂卷軸，讓長內容好滑動 */
        .flip-face::-webkit-scrollbar { width: 4px; }
        .flip-face::-webkit-scrollbar-track { background: transparent; }
        .flip-face::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 2px; }

        /* 彈窗(Modal)卷軸 */
        .modal-scroll::-webkit-scrollbar { width: 8px; }
        .modal-scroll::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px; }
        .modal-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }

        /* 動畫 */
        .fade-enter { animation: fadeEnter 0.4s ease-out forwards; }
        .slide-up { animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; }
        .pill-active { transition: all 0.3s; transform: scale(1.05); }

        @keyframes fadeEnter { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* 時間軸線 */
        .timeline-line::before {
            content: '';
            position: absolute;
            top: 24px;
            bottom: -24px;
            left: 1.5rem;
            width: 2px;
            background-color: #cbd5e1;
            z-index: 0;
        }
    </style>
</head>

        function applyTheme(colors) {

            document.documentElement.style.setProperty('--theme-color-dark', colors.dark);

        function renderTabs() {

            container.innerHTML = '';
            
            Object.values(scenariosData).forEach(scenario => {
                const btn = document.createElement('button');
                const isActive = scenario.id === currentScenarioId;
                
                btn.className = `px-5 py-2.5 rounded-full font-bold text-sm md:text-base border-2 relative overflow-hidden flex flex-col items-center justify-center gap-0.5 transition-all duration-300 focus:outline-none ${
                    isActive 
                    ? `text-white shadow-md pill-active` 
                    : `bg-white text-slate-500 border-slate-200 hover:bg-slate-50 hover:text-slate-700`
                }`;
                
                // 動態套用顏色 (避免 Tailwind class 在 runtime 失效)
                if(isActive) {
                    btn.style.backgroundColor = scenario.colors.main;
                    btn.style.borderColor = scenario.colors.main;
                } else {
                    btn.style.backgroundColor = '';
                    btn.style.borderColor = '';
                }
                
                btn.innerHTML = `
                    <div class="flex items-center gap-2">
                        <span class="w-5 h-5 rounded-full ${isActive ? 'bg-white/20' : 'bg-slate-100'} flex items-center justify-center text-[10px]">${scenario.id}</span>
                        <span>${scenario.name.replace('情境 '+scenario.id, '').replace('【','').replace('】','')}</span>
                    </div>
                `;
                
                btn.onclick = () => switchScenario(scenario.id);
                container.appendChild(btn);
            });
        }


        function getHTMLForFlipCard(frontHTML, backHTML, dataStr) {
            // 嚴格遵守 CSS 架構，不加上任何會破壞 position 的 class
            return `
                <div class="flip-card-inner">
                    <div class="flip-face p-5 flex flex-col justify-center items-center text-center group-hover:shadow-xl transition-shadow">
                        ${frontHTML}
                        <div class="mt-auto pt-3 text-[11px] text-slate-400 flex items-center gap-1 opacity-70">
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 15l-2 5L9 9l11 4-5 2zm0 0l5 5M7.188 2.239l.777 2.897M5.136 7.965l-2.898-.777M13.95 4.05l-2.122 2.122m-5.657 5.656l-2.12 2.122"></path></svg>
                            點擊翻轉看金句
                        </div>
                    </div>
                    <div class="flip-face flip-back p-5 flex flex-col">
                        <div class="flex-grow text-sm text-slate-700 font-medium leading-relaxed relative">
                            ${backHTML}
                            <div class="absolute bottom-0 left-0 w-full h-8 bg-gradient-to-t from-white to-transparent pointer-events-none"></div>
                        </div>
                        <button type="button" class="mt-3 w-full py-2 rounded-lg theme-bg-light theme-text font-bold text-sm flex items-center justify-center gap-1.5 hover:bg-slate-100 transition-colors border border-transparent hover:border-slate-200" onclick="openModalProxy(event, '${dataStr}')">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM10 7v3m0 0v3m0-3h3m-3 0H7"></path></svg>
                            放大閱讀
                        </button>
                    </div>
                </div>
            `;
        }

        function createProblemCard(p, scenario) {
            const el = document.createElement('div');
            el.className = 'flip-card group slide-up';
            
            let badge = p.isAI 
                ? `<div class="absolute top-3 right-3 flex items-center gap-1 bg-orange-50 text-orange-600 px-2 py-0.5 rounded-full text-[10px] font-bold border border-orange-100 shadow-sm"><span class="w-1.5 h-1.5 rounded-full bg-orange-500 animate-pulse"></span>AI 新興影響</div>` 
                : '';

            const front = `
                ${badge}
                <div class="text-4xl mb-3 mt-4 transform transition-transform group-hover:scale-110 drop-shadow-sm">${p.icon}</div>
                <h3 class="text-lg font-bold text-slate-800 leading-snug px-2">${p.title}</h3>
                <div class="mt-3 bg-slate-50 px-3 py-1 rounded-full text-[11px] font-bold text-slate-500 border border-slate-100">${p.freqLabel}</div>
            `;
            
            const backQuotes = p.quotes.map(q => `<p class="pl-2 border-l-[3px] theme-border line-clamp-3 mb-2 text-left text-[13px]">「${q}」</p>`).join('');
            const back = `
                <div class="text-[11px] font-bold text-slate-400 mb-2 border-b border-slate-100 pb-1 text-left">來自情境 ${scenario.id} 診斷表</div>
                ${backQuotes}
            `;

            // Data for modal
            const modalData = {
                title: `[面向] ${p.title}`,
                tags: [ { text: p.freqLabel, type: 'gray' }, ...(p.isAI ? [{ text: 'AI 新興影響', type: 'orange' }] : []) ],
                quotes: p.quotes.map(q => ({ text: q, source: `情境 ${scenario.id} 現況診斷總表` }))
            };

            // base64 encode data to pass via string attribute
            const dataStr = btoa(encodeURIComponent(JSON.stringify(modalData)));
            
            el.innerHTML = getHTMLForFlipCard(front, back, dataStr);
            
            // Toggle flipped state (only on the outer container)
            el.addEventListener('click', () => { el.classList.toggle('flipped'); });
            
            return el;
        }

        function renderSections(scenario) {
            // Section 1
            const pGrid = document.getElementById('problems-grid');
            pGrid.innerHTML = '';
            scenario.problems.forEach((p, i) => {
                const card = createProblemCard(p, scenario);
                card.style.animationDelay = `${i * 0.1}s`;
                pGrid.appendChild(card);
            });

            // Section 2
            const sGrid = document.getElementById('solutions-grid');
            const unmatchedContainer = document.getElementById('unmatched-solutions-container');

            let matchedIds = [];

                    el.style.animationDelay = `${(i+1) * 0.1}s`;

                    const modalData = {

            const aGrid = document.getElementById('actions-grid');

                                <div>
                                    <p class="text-sm md:text-[15px] font-bold ${conf.text} leading-snug">${item.text}</p>
                                    <p class="text-[11px] text-slate-500 mt-1 opacity-90">(${item.source})</p>
                                </div>
                            </li>
                        `).join('')}
                       </ul>`;

                el.innerHTML = `
                    <button class="w-full p-5 flex items-center justify-between focus:outline-none text-left ${conf.hover} transition-colors" onclick="toggleAccordion(this)">
                        <h3 class="font-bold text-base md:text-lg ${conf.text} flex items-center gap-2">
                            ${conf.title}
                            <span class="text-xs bg-white/70 px-2 py-0.5 rounded-full shadow-sm">${items.length}</span>
                        </h3>
                        <svg class="w-5 h-5 arrow transition-transform duration-300 ${conf.text} opacity-60" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                    </button>
                    <div class="content-panel hidden border-t ${conf.border}">
                        ${contentHTML}
                    </div>
                `;
                aGrid.appendChild(el);
            });

            // Section 4: Outcome
            const outText = document.getElementById('outcome-text');
            // 讓文字有重新載入的感覺
            outText.style.opacity = 0;
            setTimeout(() => {
                outText.textContent = scenario.outcome;
                outText.style.opacity = 1;
                outText.style.transition = 'opacity 0.5s ease-in';
            }, 50);
        }


        function switchScenario(id) {
            if (id === currentScenarioId && document.getElementById('problems-grid').children.length > 0) return;
            currentScenarioId = id;
            const scenario = scenariosData[id];
            
            applyTheme(scenario.colors);
            renderTabs();
            
            const main = document.getElementById('main-content');
            main.classList.remove('fade-enter');
            void main.offsetWidth; // trigger reflow
            main.classList.add('fade-enter');
            
            renderSections(scenario);
        }

        function toggleAccordion(btn) {
            const panel = btn.nextElementSibling;
            const arrow = btn.querySelector('.arrow');
            panel.classList.toggle('hidden');
            arrow.classList.toggle('rotate-180');
        }

        // 獨立於卡片定位的 Modal 代理函式
        window.openModalProxy = function(event, dataStr) {
            event.stopPropagation(); // 阻止卡片翻轉
            try {
                const data = JSON.parse(decodeURIComponent(atob(dataStr)));
                openModal(data);
            } catch(e) {
                console.error("Failed to parse modal data", e);
            }
        };

        function openModal(data) {
            document.getElementById('modal-title').textContent = data.title;
            
            // Tags
            const tagsCont = document.getElementById('modal-tags');
            tagsCont.innerHTML = data.tags.map(tag => {
                let cls = 'px-3 py-1 rounded-full text-[11px] md:text-xs font-bold border ';
                if(tag.type === 'theme') cls += 'theme-bg-light theme-text theme-border';
                else if (tag.type === 'orange') cls += 'bg-orange-50 text-orange-600 border-orange-200';
                else cls += 'bg-slate-100 text-slate-600 border-slate-200';
                return `<span class="${cls}">${tag.text}</span>`;
            }).join('');

            // Quotes
            const quotesCont = document.getElementById('modal-quotes');
            quotesCont.innerHTML = data.quotes.map(q => `
                <div class="bg-slate-50/80 p-4 md:p-5 rounded-xl border border-slate-200 relative">
                    <svg class="w-6 h-6 text-slate-200 absolute top-3 left-3" fill="currentColor" viewBox="0 0 24 24"><path d="M14.017 21v-7.391c0-5.704 3.731-9.57 8.983-10.609l.995 2.151c-2.432.917-3.995 3.638-3.995 5.849h4v10h-9.983zm-14.017 0v-7.391c0-5.704 3.748-9.57 9-10.609l.996 2.151c-2.433.917-3.996 3.638-3.996 5.849h3.983v10h-9.983z"></path></svg>
                    <p class="text-slate-700 text-[15px] md:text-base leading-relaxed relative z-10 pl-6 font-medium">「${q.text}」</p>
                    <p class="text-right text-[11px] text-slate-400 mt-3 font-bold">— 來源：${q.source}</p>
                </div>
            `).join('');

            const modal = document.getElementById('data-modal');
            const box = document.getElementById('modal-content-box');
            
            // 顯示邏輯
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            
            // 強制重繪確保動畫觸發
            void modal.offsetWidth;
            
            modal.classList.replace('opacity-0', 'opacity-100');
            box.classList.replace('scale-95', 'scale-100');
        }

        function closeModal() {
            const modal = document.getElementById('data-modal');
            const box = document.getElementById('modal-content-box');
            
            modal.classList.replace('opacity-100', 'opacity-0');
            box.classList.replace('scale-100', 'scale-95');
            
            // 等待動畫結束後隱藏
            setTimeout(() => {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
            }, 300);
        }

        // Setup Modal Listeners
        document.getElementById('modal-close-btn').addEventListener('click', closeModal);
        document.getElementById('modal-close-footer-btn').addEventListener('click', closeModal);
        document.getElementById('modal-backdrop').addEventListener('click', closeModal);
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && !document.getElementById('data-modal').classList.contains('hidden')) {
                closeModal();
            }
        });

        // Init
        window.addEventListener('DOMContentLoaded', () => {
            renderTabs();
            switchScenario('A');
        });
    </script>
</body>
</html>
